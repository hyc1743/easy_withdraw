<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Withdraw</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

<!-- Nav -->
<nav class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex items-center gap-6">
  <span class="text-lg font-bold text-white">Easy Withdraw</span>
  <button onclick="showView('accounts')" class="nav-btn text-gray-400 hover:text-white" id="nav-accounts">账户</button>
  <button onclick="showView('addressbook')" class="nav-btn text-gray-400 hover:text-white" id="nav-addressbook">地址簿</button>
  <button onclick="showView('withdraw')" class="nav-btn text-gray-400 hover:text-white" id="nav-withdraw">提现</button>
  <button onclick="showView('history')" class="nav-btn text-gray-400 hover:text-white" id="nav-history">历史</button>
  <div class="ml-auto">
    <button onclick="doLock()" id="btn-lock" class="text-sm text-red-400 hover:text-red-300 hidden">锁定</button>
  </div>
</nav>

<main class="max-w-6xl mx-auto p-4 md:p-6 flex flex-col lg:flex-row gap-4 lg:gap-6">
  <!-- Toast -->
  <div id="toast" class="hidden fixed top-4 right-4 px-4 py-2 rounded shadow-lg text-sm z-50"></div>

  <!-- Left column: main content -->
  <div class="flex-1 min-w-0">

  <!-- Unlock View -->
  <div id="view-unlock" class="view active">
    <div class="bg-gray-800 rounded-lg p-8 mt-12">
      <h2 id="unlock-title" class="text-xl font-semibold mb-4">解锁</h2>
      <input type="password" id="master-pw" placeholder="主密码"
        class="w-full bg-gray-700 border border-gray-600 rounded px-4 py-2 mb-4 focus:outline-none focus:border-blue-500">
      <button onclick="doAuth()" id="btn-auth"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-medium">解锁</button>
    </div>
  </div>

  <!-- Accounts View -->
  <div id="view-accounts" class="view">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold">交易所账户</h2>
      <button onclick="openNewAccountForm()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded text-sm">添加账户</button>
    </div>
    <div id="account-form" class="hidden bg-gray-800 rounded-lg p-6 mb-4">
      <div class="flex items-center justify-between gap-3 mb-3">
        <div>
          <div id="account-form-title" class="text-sm font-semibold text-white">添加账户</div>
          <div id="account-form-hint" class="text-xs text-gray-400">保存后可在提现页直接使用。</div>
        </div>
        <button onclick="cancelAccountEdit()" type="button" class="text-xs text-gray-400 hover:text-white">取消</button>
      </div>
      <input id="acct-id" placeholder="账户 ID (如 gate_main)" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 mb-3 text-sm">
      <select id="acct-exchange" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 mb-3 text-sm">
        <option value="gate">Gate</option>
        <option value="binance">Binance</option>
        <option value="okx">OKX</option>
        <option value="bybit">Bybit</option>
        <option value="bitget">Bitget</option>
      </select>
      <input id="acct-key" placeholder="API Key" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 mb-3 text-sm">
      <input id="acct-secret" type="password" placeholder="API Secret" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 mb-3 text-sm">
      <input id="acct-passphrase" type="password" placeholder="Passphrase (OKX/Bitget必填)" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 mb-3 text-sm">
      <label id="account-clear-passphrase-wrap" class="hidden flex items-center gap-2 text-xs text-gray-400 mb-3">
        <input id="acct-clear-passphrase" type="checkbox" class="rounded border-gray-500 bg-gray-700">
        清空当前已保存的 Passphrase
      </label>
      <div id="account-secret-note" class="hidden text-xs text-gray-400 mb-3">留空表示保留当前已保存的密钥。</div>
      <button id="account-save-btn" onclick="saveAccount()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm w-full">保存</button>
    </div>
    <div id="okx-transfer-form" class="hidden bg-gray-800 rounded-lg p-6 mb-4">
      <div class="flex items-center justify-between gap-3 mb-3">
        <div>
          <div class="text-sm font-semibold text-white">OKX 资金划转</div>
          <div id="okx-transfer-account" class="text-xs text-gray-400">账户: --</div>
        </div>
        <button onclick="closeOkxTransferForm()" type="button" class="text-xs text-gray-400 hover:text-white">取消</button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
        <input id="okx-transfer-ccy" placeholder="币种，如 USDT" class="bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
        <input id="okx-transfer-amt" type="number" step="any" min="0" placeholder="数量" class="bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
        <select id="okx-transfer-direction" class="bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
          <option value="18-6">交易账户 -> 资金账户</option>
          <option value="6-18">资金账户 -> 交易账户</option>
        </select>
      </div>
      <button onclick="submitOkxTransfer()" class="bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2 rounded text-sm w-full">执行划转</button>
      <div id="okx-transfer-result" class="hidden mt-3 rounded bg-gray-700 p-3 text-sm"></div>
    </div>
    <div id="account-list"></div>
  </div>

  <!-- Address Book View -->
  <div id="view-addressbook" class="view">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold">地址簿</h2>
      <button onclick="toggleAddrForm()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded text-sm">添加地址</button>
    </div>
    <div id="addr-form" class="hidden bg-gray-800 rounded-lg p-6 mb-4">
      <input id="addr-label" placeholder="备注名称 (如 币安TRC20)" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 mb-3 text-sm">
      <input id="addr-address" placeholder="提现地址" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 mb-3 text-sm">
      <button onclick="saveAddress()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm w-full">保存</button>
    </div>
    <div id="addr-list"></div>
  </div>

  <!-- Withdraw View -->
  <div id="view-withdraw" class="view">
    <h2 class="text-xl font-semibold mb-4">提现</h2>
    <!-- Template bar -->
    <div class="flex gap-2 mb-4">
      <select id="w-tpl" class="flex-1 bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
        <option value="">选择模版...</option>
      </select>
      <button onclick="loadTemplate()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded text-sm">加载</button>
      <button onclick="saveTemplate()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded text-sm">保存</button>
      <button onclick="deleteTemplate()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded text-sm">删除</button>
    </div>
    <div class="bg-gray-800 rounded-lg p-6">
      <select id="w-account" onchange="onAccountChange()" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 mb-3 text-sm">
        <option value="">选择账户</option>
      </select>
      <div class="relative mb-3">
        <input id="w-asset-search" placeholder="搜索币种..." autocomplete="off"
          oninput="filterCurrencies()" onfocus="showCurrencyDropdown()"
          class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
        <div id="w-asset-dropdown" class="hidden absolute z-10 w-full mt-1 bg-gray-700 border border-gray-600 rounded max-h-48 overflow-y-auto"></div>
      </div>
      <div class="relative mb-3">
        <input id="w-network-search" placeholder="先选择币种" autocomplete="off" disabled
          oninput="filterNetworks()" onfocus="showNetworkDropdown()"
          class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
        <div id="w-network-dropdown" class="hidden absolute z-10 w-full mt-1 bg-gray-700 border border-gray-600 rounded max-h-48 overflow-y-auto"></div>
      </div>
      <div id="w-network-status" class="hidden text-xs text-amber-400 mb-3"></div>
      <div class="flex gap-2 mb-3">
        <input id="w-address" placeholder="提现地址" class="flex-1 bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
        <button onclick="showAddrPicker()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded text-sm whitespace-nowrap">地址簿</button>
      </div>
      <div id="addr-picker" class="hidden bg-gray-700 border border-gray-600 rounded mb-3 max-h-48 overflow-y-auto"></div>
      <input id="w-tag" placeholder="地址标签 / Memo (可选)" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 mb-3 text-sm">
      <div class="flex gap-2 mb-1">
        <input id="w-amount" placeholder="金额" type="number" step="any" oninput="updateFeeEstimateView()" class="flex-1 bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
        <button onclick="fillMaxAmount()" type="button" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-sm whitespace-nowrap">Max</button>
      </div>
      <div id="w-balance" class="text-xs text-gray-400 mb-3">可用余额: --</div>
      <div id="w-fee-est" class="text-xs text-gray-400 mb-3">
        手续费: -- ｜ 预计到账: --
      </div>
      <div id="w-submit-warning" class="hidden mb-3 rounded border border-amber-500/40 bg-amber-500/10 px-3 py-2 text-xs text-amber-300">
        当前所选网络暂不可用；仍可继续单次提现或定时提现，用于持续重试 API 提交。
      </div>
      <div class="flex flex-col sm:flex-row gap-3 mb-3">
        <button onclick="doPreview()" class="flex-1 bg-gray-600 hover:bg-gray-500 text-white py-2 rounded text-sm">预校验</button>
        <button onclick="doExecute()" class="flex-1 bg-orange-600 hover:bg-orange-700 text-white py-2 rounded text-sm">单次提现</button>
        <button onclick="toggleSchedulePanel()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-2 rounded text-sm">定时提现</button>
      </div>
      <!-- Schedule panel -->
      <div id="schedule-panel" class="hidden bg-gray-700 rounded p-4 mb-3">
        <div class="flex gap-3 mb-3">
          <div class="flex-1">
            <label class="text-xs text-gray-400">间隔（秒）</label>
            <input id="sch-interval" type="number" min="1" value="60" class="w-full bg-gray-600 border border-gray-500 rounded px-3 py-2 text-sm">
          </div>
          <div class="flex-1">
            <label class="text-xs text-gray-400">次数</label>
            <input id="sch-count" type="number" min="1" value="5" class="w-full bg-gray-600 border border-gray-500 rounded px-3 py-2 text-sm">
          </div>
        </div>
        <div class="flex gap-3">
          <button onclick="startSchedule()" id="btn-sch-start" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-2 rounded text-sm">开始定时提现</button>
          <button onclick="stopSchedule()" id="btn-sch-stop" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded text-sm hidden">停止提现</button>
        </div>
        <div id="sch-status" class="mt-3 text-sm hidden"></div>
      </div>
      <div id="w-result" class="mt-4 text-sm hidden bg-gray-700 rounded p-3"></div>
    </div>
  </div>

  <!-- History View -->
  <div id="view-history" class="view">
    <h2 class="text-xl font-semibold mb-4">提现历史</h2>
    <div id="history-list"></div>
    <div class="flex justify-center mt-4 gap-3">
      <button onclick="loadHistory(historyOffset - 20)" id="hist-prev" class="bg-gray-700 hover:bg-gray-600 px-4 py-1.5 rounded text-sm hidden">上一页</button>
      <button onclick="loadHistory(historyOffset + 20)" id="hist-next" class="bg-gray-700 hover:bg-gray-600 px-4 py-1.5 rounded text-sm hidden">下一页</button>
    </div>
  </div>
  </div>

  <!-- Right column: progress panel -->
  <div id="progress-panel" class="w-full lg:w-80 shrink-0 hidden">
    <div class="bg-gray-800 rounded-lg p-4 lg:sticky lg:top-6">
      <h3 class="text-sm font-semibold mb-3 text-gray-300">提现进度</h3>
      <div id="prog-summary" class="text-sm mb-3">
        <div class="flex justify-between mb-1">
          <span class="text-gray-400">状态</span>
          <span id="prog-state" class="text-yellow-400">--</span>
        </div>
        <div class="flex justify-between mb-1">
          <span class="text-gray-400">轮次</span>
          <span id="prog-round">--</span>
        </div>
        <div class="flex justify-between mb-1">
          <span class="text-gray-400">间隔</span>
          <span id="prog-interval">--</span>
        </div>
        <div class="flex justify-between mb-1">
          <span class="text-gray-400">下次执行</span>
          <span id="prog-next">--</span>
        </div>
      </div>
      <!-- Progress bar -->
      <div class="w-full bg-gray-700 rounded-full h-2 mb-3">
        <div id="prog-bar" class="bg-blue-500 h-2 rounded-full transition-all" style="width:0%"></div>
      </div>
      <div class="flex gap-2 mb-3">
        <button onclick="stopSchedule()" id="btn-prog-stop" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded text-sm hidden">停止提现</button>
        <button onclick="resumeSchedule()" id="btn-prog-resume" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded text-sm hidden">继续提现</button>
      </div>
      <button onclick="terminateScheduleTask()" id="btn-prog-terminate" class="w-full bg-gray-700 hover:bg-gray-600 text-white py-2 rounded text-sm mb-3 hidden">终止当前提现任务</button>
      <h4 class="text-xs font-semibold text-gray-400 mb-2">执行日志</h4>
      <div id="prog-log" class="space-y-1 max-h-96 overflow-y-auto text-xs"></div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let historyOffset = 0;
let _schPollTimer = null;
let _schCurrentJobId = null;
let _isUnlocked = false;
let _editingAccountId = null;
let _okxTransferAccountId = null;

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function okxAccountLabel(v) {
  if (v === '6') return '资金账户';
  if (v === '18') return '交易账户';
  return v || '--';
}

// ---- API helpers ----
async function api(method, path, body) {
  const opts = { method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  const data = await res.json();
  if (res.status === 401) {
    _isUnlocked = false;
    stopSchedulePolling();
    syncUnlockedUI();
    showView('unlock');
  }
  if (!res.ok || data.ok === false) throw new Error(data.message || res.statusText);
  return data;
}

function toast(msg, ok = true) {
  const el = $('toast');
  el.textContent = msg;
  el.className = `fixed top-4 right-4 px-4 py-2 rounded shadow-lg text-sm z-50 ${ok ? 'bg-green-700' : 'bg-red-700'}`;
  setTimeout(() => el.className = 'hidden', 3000);
}

function syncUnlockedUI() {
  const navs = ['accounts', 'addressbook', 'withdraw', 'history'];
  navs.forEach((name) => {
    const btn = $('nav-' + name);
    if (!btn) return;
    btn.classList.toggle('hidden', !_isUnlocked);
  });
  $('btn-lock').classList.toggle('hidden', !_isUnlocked);
}

// ---- View switching ----
function showView(name) {
  if (!_isUnlocked && name !== 'unlock') {
    name = 'unlock';
  }
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('view-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('text-white'));
  const nb = $('nav-' + name);
  if (nb) nb.classList.add('text-white');
  if (name === 'accounts') loadAccounts();
  if (name === 'addressbook') loadAddresses();
  if (name === 'withdraw') {
    loadAccountSelect();
    syncSchedule();
  }
  if (name === 'history') loadHistory(0);
}

// ---- Auth ----
async function checkStatus() {
  const s = await api('GET', '/auth/status');
  _isUnlocked = !!s.unlocked;
  syncUnlockedUI();
  if (s.unlocked) {
    showView('withdraw');
  } else if (!s.initialized) {
    $('unlock-title').textContent = '设置主密码';
    $('btn-auth').textContent = '初始化';
    showView('unlock');
  } else {
    showView('unlock');
  }
}

async function doAuth() {
  const pw = $('master-pw').value;
  if (!pw) return;
  try {
    const s = await api('GET', '/auth/status');
    if (!s.initialized) {
      await api('POST', '/auth/init', { masterPassword: pw });
      toast('主密码已设置');
    }
    await api('POST', '/auth/unlock', { masterPassword: pw });
    $('master-pw').value = '';
    _isUnlocked = true;
    syncUnlockedUI();
    toast('已解锁');
    showView('withdraw');
  } catch (e) { toast(e.message, false); }
}

async function doLock() {
  await api('POST', '/auth/lock');
  _isUnlocked = false;
  stopSchedulePolling();
  syncUnlockedUI();
  showView('unlock');
  toast('已锁定');
}

// ---- Accounts ----
function resetAccountForm() {
  _editingAccountId = null;
  $('account-form-title').textContent = '添加账户';
  $('account-form-hint').textContent = '保存后可在提现页直接使用。';
  $('account-save-btn').textContent = '保存';
  $('account-secret-note').classList.add('hidden');
  $('account-clear-passphrase-wrap').classList.add('hidden');
  $('acct-clear-passphrase').checked = false;
  $('acct-id').disabled = false;
  $('acct-id').value = '';
  $('acct-exchange').value = 'gate';
  $('acct-key').value = '';
  $('acct-secret').value = '';
  $('acct-passphrase').value = '';
}

function openNewAccountForm() {
  resetAccountForm();
  $('account-form').classList.remove('hidden');
}

function cancelAccountEdit() {
  resetAccountForm();
  $('account-form').classList.add('hidden');
}

function closeOkxTransferForm() {
  _okxTransferAccountId = null;
  $('okx-transfer-account').textContent = '账户: --';
  $('okx-transfer-ccy').value = '';
  $('okx-transfer-amt').value = '';
  $('okx-transfer-direction').value = '18-6';
  $('okx-transfer-result').classList.add('hidden');
  $('okx-transfer-result').textContent = '';
  $('okx-transfer-form').classList.add('hidden');
}

async function loadAccounts() {
  try {
    const d = await api('GET', '/accounts');
    const el = $('account-list');
    if (!d.accounts.length) { el.innerHTML = '<p class="text-gray-500 text-sm">暂无账户</p>'; return; }
    el.innerHTML = d.accounts.map(a => `
      <div class="bg-gray-800 rounded p-4 mb-2 flex justify-between items-center">
        <div>
          <span class="font-medium">${esc(a.id)}</span>
          <span class="text-gray-400 text-sm ml-2">${esc(a.exchange)}</span>
          ${a.has_secret ? '<span class="text-xs text-emerald-400 ml-2">已保存密钥</span>' : '<span class="text-xs text-amber-400 ml-2">缺少密钥</span>'}
        </div>
        <div class="flex items-center gap-4">
          ${a.exchange === 'okx' ? `<button onclick="openOkxTransferForm('${esc(a.id)}')" class="text-cyan-400 hover:text-cyan-300 text-sm">资金划转</button>` : ''}
          <button onclick="editAccount('${esc(a.id)}')" class="text-blue-400 hover:text-blue-300 text-sm">编辑</button>
          <button onclick="deleteAccount('${esc(a.id)}')" class="text-red-400 hover:text-red-300 text-sm">删除</button>
        </div>
      </div>`).join('');
  } catch (e) { toast(e.message, false); }
}

function openOkxTransferForm(id) {
  _okxTransferAccountId = id;
  $('okx-transfer-account').textContent = `账户: ${id}`;
  $('okx-transfer-result').classList.add('hidden');
  $('okx-transfer-result').textContent = '';
  $('okx-transfer-form').classList.remove('hidden');
  $('okx-transfer-ccy').focus();
}

async function editAccount(id) {
  try {
    const d = await api('GET', '/accounts/' + encodeURIComponent(id));
    const a = d.account;
    _editingAccountId = id;
    $('account-form-title').textContent = '编辑账户';
    $('account-form-hint').textContent = '敏感字段留空时会保留当前值。';
    $('account-save-btn').textContent = '保存修改';
    $('account-secret-note').classList.remove('hidden');
    $('account-clear-passphrase-wrap').classList.toggle('hidden', !a.has_passphrase);
    $('acct-clear-passphrase').checked = false;
    $('acct-id').disabled = false;
    $('acct-id').value = a.id;
    $('acct-exchange').value = a.exchange;
    $('acct-key').value = a.api_key || '';
    $('acct-secret').value = '';
    $('acct-passphrase').value = '';
    $('account-form').classList.remove('hidden');
  } catch (e) { toast(e.message, false); }
}

async function saveAccount() {
  try {
    const body = {
      id: $('acct-id').value,
      exchange: $('acct-exchange').value,
      api_key: $('acct-key').value,
      api_secret: $('acct-secret').value,
      passphrase: $('acct-clear-passphrase').checked ? null : $('acct-passphrase').value,
    };
    if (_editingAccountId) {
      await api('PUT', '/accounts/' + encodeURIComponent(_editingAccountId), body);
      toast('账户已更新');
    } else {
      await api('POST', '/accounts', body);
      toast('账户已保存');
    }
    cancelAccountEdit();
    loadAccounts();
    loadAccountSelect();
  } catch (e) { toast(e.message, false); }
}

async function deleteAccount(id) {
  if (!confirm('确定删除账户 ' + id + '？')) return;
  try {
    await api('DELETE', '/accounts/' + id);
    if (_editingAccountId === id) {
      cancelAccountEdit();
    }

function num(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function fmtAmount(v) {
  if (!Number.isFinite(v)) return '0';
  return v.toFixed(8).replace(/\.?0+$/, '');
}

function updateBalanceView() {
  $('w-balance').textContent = selectedAsset
    ? `可用余额: ${selectedAvailable || '0'} ${selectedAsset}`
    : '可用余额: --';
}

function updateNetworkStatusView() {
  const el = $('w-network-status');
  const warningEl = $('w-submit-warning');
  if (!selectedChainInfo) {
    el.textContent = '';
    el.classList.add('hidden');
    warningEl.classList.add('hidden');
    return;
  }

  if (selectedChainInfo.is_withdraw_disabled) {
    el.textContent = `当前网络 ${selectedChain} 暂不可用，仍允许提交 API 提现，可配合定时提现持续重试。`;
    el.classList.remove('hidden');
    warningEl.classList.remove('hidden');
    return;
  }

  el.textContent = '';
  el.classList.add('hidden');
  warningEl.classList.add('hidden');
}

function updateFeeEstimateView() {
  if (!selectedAsset || !selectedChainInfo) {
    $('w-fee-est').textContent = '手续费: -- ｜ 预计到账: --';
    return;
  }

  const amount = num($('w-amount').value);
  const fixFee = num(selectedChainInfo.withdraw_fix);
  const pctFeeRate = num(selectedChainInfo.withdraw_percent) / 100;
  const pctFee = amount > 0 ? amount * pctFeeRate : 0;
  const totalFee = fixFee + pctFee;
  const arrived = Math.max(0, amount - totalFee);

  $('w-fee-est').textContent =
    `手续费: ${fmtAmount(totalFee)} ${selectedAsset} (固定 ${fmtAmount(fixFee)} + 比例 ${fmtAmount(num(selectedChainInfo.withdraw_percent))}%) ｜ 预计到账: ${fmtAmount(arrived)} ${selectedAsset}`;
}

async function loadAssetBalance(currency) {
  const accountId = $('w-account').value;
  if (!accountId || !currency) {
    selectedAvailable = '';
    updateBalanceView();
    return;
  }
  try {
    const d = await api('GET', `/currencies/${encodeURIComponent(currency)}/balance?account_id=${encodeURIComponent(accountId)}`);
    selectedAvailable = d.balance?.available || '0';
    updateBalanceView();
    updateFeeEstimateView();
  } catch (e) {
    selectedAvailable = '';
    updateBalanceView();
    updateFeeEstimateView();
    toast('余额读取失败: ' + e.message, false);
  }
}

function fillMaxAmount() {
  if (!selectedAsset) {
    toast('请先选择币种', false);
    return;
  }
  if (!selectedAvailable) {
    toast('暂无可用余额', false);
    return;
  }
  const available = num(selectedAvailable);
  const fixFee = num(selectedChainInfo?.withdraw_fix);
  const maxAmount = Math.max(0, available - fixFee);
  $('w-amount').value = fmtAmount(maxAmount);
  updateFeeEstimateView();
}

function filterCurrencies() {
  const q = $('w-asset-search').value.toUpperCase();
  const dd = $('w-asset-dropdown');
  if (!allCurrencies.length) { dd.classList.add('hidden'); return; }
  const filtered = allCurrencies
    .filter(c => c.currency.includes(q) || c.name_en.toUpperCase().includes(q))
    .sort((a, b) => Number(a.withdraw_disabled) - Number(b.withdraw_disabled))
    .slice(0, 50);
  if (!filtered.length) {
    dd.innerHTML = '<div class="px-3 py-2 text-gray-400 text-sm">无匹配结果</div>';
  } else {
    dd.innerHTML = filtered.map(c =>
      `<div class="px-3 py-2 hover:bg-gray-600 cursor-pointer text-sm" onclick="selectCurrency('${esc(c.currency)}')">`
      + `<span class="font-medium">${esc(c.currency)}</span>`
      + (c.name_en ? ` <span class="text-gray-400 text-xs">${esc(c.name_en)}</span>` : '')
      + (c.withdraw_disabled ? ' <span class="text-amber-400 text-xs">无可用网络</span>' : '')
      + `</div>`
    ).join('');
  }
  dd.classList.remove('hidden');
}

  updateNetworkStatusView();

  $('w-asset-dropdown').classList.add('hidden');
  allChains = [];
  selectedChain = '';
  $('w-network-search').value = '';
  $('w-network-search').disabled = true;
  $('w-network-search').placeholder = '加载网络中...';
  const accountId = $('w-account').value;
  try {
    await loadAssetBalance(currency);

      : `搜索网络 (当前暂无可用网络，共 ${allChains.length} 个)...`;
  } catch (e) {
    toast(e.message, false);

// ---- Scheduled withdraw ----
function toggleSchedulePanel() {
  $('schedule-panel').classList.toggle('hidden');
}

function showProgressPanel() {
  $('progress-panel').classList.remove('hidden');
}

function addProgressLog(msg, ok = true) {
  const time = new Date().toLocaleTimeString();
  const color = ok ? 'text-green-400' : 'text-red-400';
  const row = `<div class="${color}">[${esc(time)}] ${esc(msg)}</div>`;
  $('prog-log').innerHTML = row + $('prog-log').innerHTML;
}

async function startSchedule() {
  const interval = parseInt($('sch-interval').value) || 60;
  const count = parseInt($('sch-count').value) || 1;
  try {
    const r = await api('POST', '/withdraw/schedule/start', {
      interval_sec: interval,
      count,
      withdraw: getWithdrawBody(),
    });
    _schCurrentJobId = r.job.id;
    renderScheduleJob(r.job);
    startSchedulePolling();
    toast(`定时提现已启动: ${count} 次 / ${interval}s`);
  } catch (e) {
    toast(e.message, false);
  }
}

function setScheduleButtons(isRunning) {
  $('btn-sch-start').classList.toggle('hidden', isRunning);
  $('btn-sch-stop').classList.toggle('hidden', !isRunning);
}

function setProgressButtons(job) {
  const isRunning = !!job && job.state === 'running';
  const canResume = !!job && (job.state === 'running' || job.state === 'stopped');
  const hasJob = !!job;
  $('btn-prog-stop').classList.toggle('hidden', !isRunning);
  $('btn-prog-resume').classList.toggle('hidden', !canResume);
  $('btn-prog-terminate').classList.toggle('hidden', !hasJob);
}

function clearProgressPanel() {
  _schCurrentJobId = null;
  stopSchedulePolling();
  $('progress-panel').classList.add('hidden');
  $('prog-state').textContent = '--';
  $('prog-state').className = 'text-yellow-400';
  $('prog-interval').textContent = '--';
  $('prog-round').textContent = '--';
  $('prog-next').textContent = '--';
  $('prog-bar').style.width = '0%';
  $('prog-log').innerHTML = '';
  $('sch-status').classList.add('hidden');
  $('sch-status').innerHTML = '';
  setScheduleButtons(false);
  setProgressButtons(null);
}

function formatState(state) {
  if (state === 'running') return ['运行中', 'text-yellow-400'];
  if (state === 'completed') return ['已完成', 'text-green-400'];
  return ['已停止', 'text-red-400'];
}

function renderScheduleJob(job) {
  if (!job) return;
  showProgressPanel();
  const [stateText, stateClass] = formatState(job.state);
  const pct = job.total_count > 0 ? Math.round((job.done_count / job.total_count) * 100) : 0;
  const remainSec = job.next_run_at
    ? Math.max(0, Math.ceil((new Date(job.next_run_at).getTime() - Date.now()) / 1000))
    : null;

  $('prog-state').textContent = stateText;
  $('prog-state').className = stateClass;
  $('prog-interval').textContent = `${job.interval_sec}s`;
  $('prog-round').textContent = `${job.done_count} / ${job.total_count}`;
  $('prog-next').textContent = remainSec !== null ? `${remainSec}s` : '--';
  $('prog-bar').style.width = `${pct}%`;

  const logs = job.logs || [];
  $('prog-log').innerHTML = logs.map((l) => {
    const color = l.ok ? 'text-green-400' : 'text-red-400';
    const time = new Date(l.timestamp).toLocaleTimeString();
    return `<div class="${color}">[${esc(time)}] ${esc(l.message)}</div>`;
  }).join('');

  $('sch-status').classList.remove('hidden');
  $('sch-status').innerHTML = `进度: ${job.done_count}/${job.total_count}`;
  setScheduleButtons(job.state === 'running');
  setProgressButtons(job);
}

async function syncSchedule() {
  try {
    const active = await api('GET', '/withdraw/schedule/active');
    if (active.job) {
      _schCurrentJobId = active.job.id;
      renderScheduleJob(active.job);
      startSchedulePolling();
      return;
    }

    if (_schCurrentJobId) {
      const d = await api('GET', `/withdraw/schedule/${encodeURIComponent(_schCurrentJobId)}`);
      renderScheduleJob(d.job);
      if (d.job.state !== 'running') stopSchedulePolling();
      return;
    }

    setScheduleButtons(false);
    setProgressButtons(null);
  } catch (e) {
    stopSchedulePolling();
  }
}

function startSchedulePolling() {
  if (_schPollTimer) return;
  _schPollTimer = setInterval(() => {
    void syncSchedule();
  }, 1000);
}

function stopSchedulePolling() {
  if (_schPollTimer) {
    clearInterval(_schPollTimer);
    _schPollTimer = null;
  }
}

async function stopSchedule() {
  try {
    if (!_schCurrentJobId) {
      const active = await api('GET', '/withdraw/schedule/active');
      if (active.job) _schCurrentJobId = active.job.id;
    }
    if (!_schCurrentJobId) {
      toast('当前没有运行中的定时任务', false);
      return;
    }
    const d = await api('POST', `/withdraw/schedule/${encodeURIComponent(_schCurrentJobId)}/stop`);
    renderScheduleJob(d.job);
    stopSchedulePolling();
    toast('定时提现已停止');
  } catch (e) {
    toast(e.message, false);
  }
}

async function resumeSchedule() {
  try {
    if (!_schCurrentJobId) {
      const active = await api('GET', '/withdraw/schedule/active');
      if (active.job) _schCurrentJobId = active.job.id;
    }
    if (!_schCurrentJobId) {
      toast('没有可继续的定时任务', false);
      return;
    }
    const d = await api('POST', `/withdraw/schedule/${encodeURIComponent(_schCurrentJobId)}/resume`);
    renderScheduleJob(d.job);
    startSchedulePolling();
    toast('定时提现已继续');
  } catch (e) {
    toast(e.message, false);
  }
}

async function terminateScheduleTask() {
  try {
    if (!_schCurrentJobId) {
      clearProgressPanel();
      toast('已清空当前提现进度');
      return;
    }

    let state = null;
    try {
      const d = await api('GET', `/withdraw/schedule/${encodeURIComponent(_schCurrentJobId)}`);
      state = d.job?.state || null;
    } catch (e) {
      state = null;
    }

    if (state === 'running') {
      await api('POST', `/withdraw/schedule/${encodeURIComponent(_schCurrentJobId)}/stop`);
    }

    clearProgressPanel();
    toast('当前提现任务已终止，进度面板已清空');
  } catch (e) {
    toast(e.message, false);
  }
}

// ---- History ----
async function loadHistory(offset = 0) {
  historyOffset = Math.max(0, offset);
  try {
    const d = await api('GET', `/withdraw/history?limit=20&offset=${historyOffset}`);
    const el = $('history-list');
    if (!d.records.length) { el.innerHTML = '<p class="text-gray-500 text-sm">暂无记录</p>'; return; }
    el.innerHTML = d.records.map(r => `
      <div class="bg-gray-800 rounded p-3 mb-2 text-sm">
        <div class="flex justify-between">
          <span class="font-medium">${esc(r.asset)} (${esc(r.network)})</span>
          <span class="text-gray-400">${esc(r.amount)}</span>
        </div>
        <div class="text-gray-400 text-xs mt-1">${esc(r.address)}</div>
        <div class="flex justify-between text-xs mt-1">
          <span>${esc(r.account_id)}</span>
          <span>${new Date(r.timestamp).toLocaleString()}</span>
        </div>
      </div>`).join('');
    $('hist-prev').classList.toggle('hidden', historyOffset === 0);
    $('hist-next').classList.toggle('hidden', historyOffset + 20 >= d.total);
  } catch (e) { toast(e.message, false); }
}

// ---- Init ----
$('master-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
syncUnlockedUI();
checkStatus();
</script>
</body>
</html>
